<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interruption budget</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Barlow:wght@400;600&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <h1>Interruption budget</h1>
  <p class="lede" id="preference">Interrupt for blocked work. Otherwise digest.</p>
  <p class="decision" id="decision" aria-live="polite">Clear</p>
  <p class="why" id="why"></p>
  <div class="rule">
    <button id="quiet" type="button" aria-pressed="false">Hold quiet hours</button>
  </div>
  <div class="sheet" id="sheet"></div>
  <script src="app.js"></script>
</body>
</html>
