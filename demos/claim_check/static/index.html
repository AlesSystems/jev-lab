<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claim check</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Barlow:wght@400;600&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <h1>Claim check</h1>
  <p class="lede">Test a claim against evidence. Load an example or write your own, then run the check. Jev evaluates support; keyword overlap is shown for comparison.</p>
  <div class="choices" id="scenarios"></div>
  <form id="check-form">
    <label for="claim">Claim</label>
    <textarea id="claim" name="claim" rows="2" maxlength="2000" required></textarea>
    <label for="evidence">Evidence passage</label>
    <textarea id="evidence" name="evidence" rows="5" maxlength="12000" required></textarea>
    <button class="primary" id="run" type="submit">Run claim check</button>
    <p class="lede" id="key-status">Checking this server for TYPESAFE_API_KEY…</p>
  </form>
  <div role="status" aria-live="polite">
    <p class="decision" id="decision">Ready</p>
    <p class="why" id="why">Load an example or enter a claim and evidence.</p>
  </div>
  <div class="sheet" id="sheet"></div>
  <script src="app.js"></script>
</body>
</html>
